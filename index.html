<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continent Zero: Total Strategy</title>
    <style>
        :root { --bg: #0d1117; --panel: #161b22; --accent: #58a6ff; --gold: #f2cc60; --ru: #8957e5; --us: #238636; --neutral: #30363d; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #c9d1d9; margin: 0; overflow-x: hidden; }
        
        .ui-top { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel); padding: 15px; border-bottom: 1px solid #30363d; sticky: top; }
        .stat-box { text-align: center; }
        .stat-box b { color: var(--gold); font-size: 1.2em; }

        /* ГРАФИЧЕСКАЯ КАРТА */
        .map-container { position: relative; width: 100%; height: 400px; background: #010409; margin: 20px 0; border: 2px solid #30363d; border-radius: 15px; overflow: hidden; }
        .continent-shape { position: absolute; width: 90%; height: 80%; top: 10%; left: 5%; background: #1c2128; border-radius: 50% 30% 50% 40%; filter: blur(20px); opacity: 0.3; }
        
        .region { position: absolute; width: 100px; height: 80px; border-radius: 10px; border: 2px solid #f0f6fc10; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 10px; font-weight: bold; z-index: 5; }
        .region:hover { transform: scale(1.1); z-index: 10; }
        .region.owned-p { background: var(--ru); border-color: white; box-shadow: 0 0 15px var(--ru); }
        .region.owned-ai { background: #da3633; border-color: white; }
        .region.neutral { background: var(--neutral); }
        .region.selected { border: 3px solid var(--accent); }

        /* Армия на карте */
        #army-marker { position: absolute; width: 30px; height: 30px; background: white; border-radius: 50%; border: 3px solid var(--accent); z-index: 20; transition: all 3s linear; display: flex; align-items: center; justify-content: center; font-size: 18px; pointer-events: none; }

        /* Панель управления */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 15px 20px; }
        .panel { background: var(--panel); border: 1px solid #30363d; border-radius: 12px; padding: 15px; }
        
        button { background: #21262d; color: white; border: 1px solid #30363d; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; margin: 5px 0; transition: 0.2s; }
        button:hover:not(:disabled) { background: #30363d; }
        button:disabled { opacity: 0.3; }
        .btn-action { background: var(--accent); border: none; font-weight: bold; }
        .btn-attack { background: #da3633; border: none; font-weight: bold; }

        .log { background: #010409; height: 150px; overflow-y: auto; font-family: monospace; font-size: 11px; padding: 10px; border-radius: 8px; border: 1px solid #30363d; }
        .buildings-icons { display: flex; gap: 2px; margin-top: 5px; }
        .b-dot { width: 6px; height: 6px; background: var(--gold); border-radius: 50%; }
        
        .progress-move { position: absolute; top: 0; left: 0; height: 4px; background: var(--accent); width: 0%; transition: 3s linear; }
    </style>
</head>
<body>

<div id="game">
    <div class="ui-top">
        <div class="stat-box">Эпоха<br><b id="p-epoch-name">Камень</b></div>
        <div class="stat-box">Золото<br><b id="p-gold">0</b> <small id="p-inc">+0/с</small></div>
        <div class="stat-box">Армия<br><b id="p-mil">0</b></div>
    </div>

    <div class="map-container" id="map-area">
        <div class="continent-shape"></div>
        <div id="army-marker">🎖️</div>
        <div id="progress-line" class="progress-move"></div>
        
        <div id="reg-0" class="region owned-p" style="top: 200px; left: 30px;" onclick="selectRegion(0)">Москва</div>
        <div id="reg-1" class="region neutral" style="top: 120px; left: 140px;" onclick="selectRegion(1)">Сибирь</div>
        <div id="reg-2" class="region neutral" style="top: 240px; left: 240px;" onclick="selectRegion(2)">Чукотка</div>
        <div id="reg-3" class="region neutral" style="top: 150px; left: 360px;" onclick="selectRegion(3)">Берингия</div>
        <div id="reg-4" class="region neutral" style="top: 50px; left: 480px;" onclick="selectRegion(4)">Аляска</div>
        <div id="reg-5" class="region neutral" style="top: 180px; left: 600px;" onclick="selectRegion(5)">Техас</div>
        <div id="reg-6" class="region owned-ai" style="top: 250px; left: 720px;" onclick="selectRegion(6)">Вашингтон</div>
    </div>

    <div class="controls">
        <div class="panel">
            <h3 id="selected-name">Выберите регион</h3>
            <div id="actions-panel" class="hidden">
                <button id="btn-move" class="btn-action" onclick="moveArmy()">ПЕРЕЙТИ (3 сек)</button>
                <div id="local-ops" class="hidden">
                    <button onclick="buy('build')">Построить здание (<span id="c-build">50</span>)</button>
                    <button onclick="buy('mil')">Нанять отряд (<span id="c-mil">30</span>)</button>
                    <button id="btn-attack" class="btn-attack" onclick="attack()">ШТУРМ</button>
                </div>
            </div>
            <button id="btn-evolve" style="margin-top:20px; border-color:var(--gold)" onclick="buy('up')">ЭВОЛЮЦИЯ (<span id="c-up">500</span>)</button>
        </div>

        <div class="panel">
            <h3>Журнал событий</h3>
            <div class="log" id="log"></div>
            <button onclick="resetGame()" style="font-size:10px; margin-top:10px;">Сбросить всё</button>
        </div>
    </div>
</div>

<script>
const DATA = {
    epochs: ["Первобытность", "Античность", "Средневековье", "Индустрия", "Современность"],
    units: ["Дубинщики", "Легионеры", "Рыцари", "Мушкетеры", "Танки"]
};

let state = {
    p: { or: 100, mil: 10, ep: 0, loc: 0 },
    ai: { or: 100, mil: 30, ep: 0, loc: 6 },
    regions: [
        { name: "Москва", owner: "p", b: 1, x: 30, y: 200 },
        { name: "Сибирь", owner: "n", b: 0, x: 140, y: 120 },
        { name: "Чукотка", owner: "n", b: 0, x: 240, y: 240 },
        { name: "Берингия", owner: "n", b: 0, x: 360, y: 150 },
        { name: "Аляска", owner: "n", b: 0, x: 480, y: 50 },
        { name: "Техас", owner: "n", b: 0, x: 600, y: 180 },
        { name: "Вашингтон", owner: "ai", b: 1, x: 720, y: 250 }
    ],
    selected: null,
    isMoving: false
};

function init() {
    updateArmyMarker();
    setInterval(tick, 1000);
    render();
    addLog("Игра началась. Перемещайте армию для захвата материка.");
}

function tick() {
    if(state.isMoving) return;

    // Экономика: доход только от своих регионов
    let income = 0;
    state.regions.forEach(r => {
        if(r.owner === "p") income += (r.b * (state.p.ep + 1) * 3);
    });
    
    let upkeep = Math.floor(state.p.mil * 0.1);
    state.p.or += Math.max(1, (2 + income - upkeep));

    // Мини-ИИ
    state.ai.or += 5;
    if(state.ai.or > 150) { state.ai.mil += 10; state.ai.or -= 100; }

    render();
}

function selectRegion(id) {
    if(state.isMoving) return;
    state.selected = id;
    const reg = state.regions[id];
    
    document.getElementById('selected-name').innerText = reg.name + (reg.owner === "p" ? " (Ваш)" : " (Чужой)");
    document.getElementById('actions-panel').classList.remove('hidden');
    
    if(state.p.loc === id) {
        document.getElementById('btn-move').classList.add('hidden');
        document.getElementById('local-ops').classList.remove('hidden');
        document.getElementById('btn-attack').style.display = reg.owner === "p" ? "none" : "block";
    } else {
        document.getElementById('btn-move').classList.remove('hidden');
        document.getElementById('local-ops').classList.add('hidden');
    }
    
    // Подсветка
    document.querySelectorAll('.region').forEach(r => r.classList.remove('selected'));
    document.getElementById('reg-'+id).classList.add('selected');
}

function moveArmy() {
    if(state.selected === null || state.isMoving) return;
    
    state.isMoving = true;
    const target = state.regions[state.selected];
    
    addLog(`Армия выдвигается в ${target.name}...`);
    
    // Анимация линии прогресса
    const bar = document.getElementById('progress-line');
    bar.style.width = "100%";
    
    updateArmyMarker(target.x, target.y);

    setTimeout(() => {
        state.p.loc = state.selected;
        state.isMoving = false;
        bar.style.width = "0%";
        addLog(`Прибыли в ${target.name}`);
        selectRegion(state.selected);
        render();
    }, 3000);
}

function buy(type) {
    let m = Math.pow(5, state.p.ep);
    let reg = state.regions[state.p.loc];

    if(type === 'build' && state.p.or >= 50*(state.p.ep+1)) {
        state.p.or -= 50*(state.p.ep+1);
        reg.b++;
        addLog(`Построено здание в ${reg.name}`);
    } else if(type === 'mil' && state.p.or >= 30*(state.p.ep+1)) {
        state.p.or -= 30*(state.p.ep+1);
        state.p.mil += 10 * (state.p.ep + 1);
        addLog(`Наняты ${DATA.units[state.p.ep]}`);
    } else if(type === 'up' && state.p.or >= 500*m && state.p.ep < 4) {
        state.p.or -= 500*m;
        state.p.ep++;
        addLog(`ЭВОЛЮЦИЯ! Мы в эпохе: ${DATA.epochs[state.p.ep]}`, "#58a6ff");
    }
    render();
}

function attack() {
    let reg = state.regions[state.p.loc];
    if(reg.owner === "p") return;

    addLog(`Штурм региона ${reg.name}...`);
    if(reg.b > 0) {
        reg.b--;
        state.p.mil -= 5;
        addLog(`Разрушено здание врага! Потери: 5 силы.`);
    } else {
        reg.owner = "p";
        addLog(`🚩 РЕГИОН ${reg.name} ЗАХВАЧЕН!`, "#238636");
    }
    render();
    selectRegion(state.p.loc);
}

function updateArmyMarker(x, y) {
    const marker = document.getElementById('army-marker');
    if(!x) {
        x = state.regions[state.p.loc].x;
        y = state.regions[state.p.loc].y;
    }
    marker.style.left = (x + 35) + "px";
    marker.style.top = (y + 25) + "px";
}

function render() {
    document.getElementById('p-gold').innerText = Math.floor(state.p.or);
    document.getElementById('p-mil').innerText = state.p.mil;
    document.getElementById('p-epoch-name').innerText = DATA.epochs[state.p.ep];
    
    // Цены
    let m = Math.pow(5, state.p.ep);
    document.getElementById('c-build').innerText = 50*(state.p.ep+1);
    document.getElementById('c-mil').innerText = 30*(state.p.ep+1);
    document.getElementById('c-up').innerText = 500*m;

    // Обновление классов регионов
    state.regions.forEach((r, i) => {
        const el = document.getElementById('reg-'+i);
        el.className = `region ${r.owner === 'p' ? 'owned-p' : (r.owner === 'ai' ? 'owned-ai' : 'neutral')} ${state.selected === i ? 'selected' : ''}`;
        
        let bDots = '<div class="buildings-icons">';
        for(let j=0; j<r.b; j++) bDots += '<div class="b-icon"></div>'; // Иконки зданий в коде выше CSS .b-icon исправлен на .b-dot
        el.innerHTML = `${r.name}<div class="buildings-icons">${"●".repeat(r.b)}</div>`;
    });
}

function addLog(msg, color = "#c9d1d9") {
    const log = document.getElementById('log');
    log.innerHTML = `<div style="color:${color}">> ${msg}</div>` + log.innerHTML;
}

function resetGame() { localStorage.clear(); location.reload(); }

window.onload = init;
</script>
</body>
</html>
